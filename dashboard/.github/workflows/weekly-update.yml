name: Weekly AI Tools Update

on:
  # Run every Sunday at midnight UTC
  schedule:
    - cron: '0 0 * * 0'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      tools_json:
        description: 'JSON string with new tools to add (optional)'
        required: false
        type: string

jobs:
  update-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd dashboard
          npm ci

      - name: Add manually provided tools
        if: github.event.inputs.tools_json != ''
        run: |
          echo '${{ github.event.inputs.tools_json }}' > /tmp/new_tools.json
          python dashboard/scripts/research_new_tools.py batch /tmp/new_tools.json

      - name: Check for pending tools
        id: check_pending
        run: |
          if [ -f "dashboard/src/data/pending_tools.json" ]; then
            echo "has_pending=true" >> $GITHUB_OUTPUT
            python dashboard/scripts/research_new_tools.py batch dashboard/src/data/pending_tools.json
            rm dashboard/src/data/pending_tools.json
          else
            echo "has_pending=false" >> $GITHUB_OUTPUT
          fi

      - name: Update timestamp
        run: |
          python -c "
          import json
          from datetime import datetime
          
          with open('dashboard/src/data/tools.json', 'r') as f:
              data = json.load(f)
          
          data['metadata']['last_updated'] = datetime.now().isoformat()
          
          with open('dashboard/src/data/tools.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          "

      - name: Build dashboard
        run: |
          cd dashboard
          npm run build

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: weekly AI tools update"
          title: "Weekly AI Tools Update - ${{ github.run_number }}"
          body: |
            ## Weekly AI Tools Database Update
            
            This PR was automatically generated by the weekly update workflow.
            
            ### Changes
            - Updated tools database timestamp
            - Added any pending tools from `pending_tools.json`
            ${{ github.event.inputs.tools_json != '' && '- Added manually provided tools' || '' }}
            
            ### How to add new tools
            
            1. **Manual via GitHub Actions**:
               - Go to Actions → Weekly AI Tools Update → Run workflow
               - Provide JSON in the format:
               ```json
               {
                 "tools": [
                   {
                     "name": "Tool Name",
                     "url": "https://tool.com",
                     "description": "What it does",
                     "category": "Category Name"
                   }
                 ]
               }
               ```
            
            2. **Via pending_tools.json**:
               - Add tools to `dashboard/src/data/pending_tools.json`
               - They will be processed on the next weekly run
            
            ---
            Auto-generated by GitHub Actions
          branch: weekly-update-${{ github.run_number }}
          delete-branch: true
          labels: |
            automated
            tools-update
